# Pilot's store environment: where the brain, a headless Claude Code session,
# runs and drives the managed projects' environments. The repo carries the
# brain's skills and no data.
# Schema: https://kubecoder.home/help/reference/config-yaml/

capabilities:
  github: rw
  # The brain starts and resumes sessions in the managed projects'
  # environments.
  fleetAdmin: true
  # Outside the node's environment cap, so it always starts; Pilot's server
  # reads the exemption and never stops it (KC-159).
  capacityExempt: true

# pilot-sync keeps /work/Projects, the record's tree, in step with Pilot's
# record, and serves the hook's local check (.claude/settings.json) on
# 127.0.0.1:3510. Its image, Pilot's address and its bearer are the catalog
# entry's, each stage's own.
services:
  - pilot-sync

# The brain's scripts are a uv project (pyproject.toml), and the dev image has
# no uv: they run here, `cexec python uv run tools/pilot.py …`, and so do the
# repo's setup and test (.kubecoder/project.yaml).
tools:
  - use: python

preamble:
  instructions: |
    Pilot's store environment: the brain's skills (/work/PilotProjects),
    and no data. The app is pvginkel/PilotApp.
