# Curated entry points for PilotProjects, the store environment's repo: the brain's scripts and
# skills, and no data. A uv project, run in the python tool container: setup syncs its
# environment from uv.lock, pilot-dsl fetched from GitHub, and pod start runs it; test runs every
# test under tests/: pilot.py's, the hook's, against a stand-in for pilot-sync's local endpoint, and
# the map's, the shape of CLAUDE.md, the rule files and the skills.
projects:
  root:
    description: >-
      Pilot's store environment: its KubeCoder configuration, the hook that holds the record's
      tree's write lock around each writing tool call and reports what the record made of it,
      and the brain's scripts and skills; no data.
    setup: cexec python uv sync --locked
    test:
      - cexec python uv run --locked python -m unittest discover --start-directory tests --verbose
