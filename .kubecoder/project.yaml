# Curated entry points for PilotProjects, the store environment's repo: the brain's skills and
# no data. Its test runs the hook of .claude/settings.json against a stand-in for pilot-sync's
# local check.
projects:
  root:
    description: >-
      Pilot's store environment: its KubeCoder configuration, the hook that checks each edit of
      the record's tree, and the brain's skills; no data.
    test:
      - python3 -m unittest discover --start-directory tests --verbose
